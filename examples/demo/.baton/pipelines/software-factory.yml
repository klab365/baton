---
id: software-factory
steps:
- id: plan
  name: Analyze and plan
  agentId: factory-planner
  includeTask: true
  prompt: |
    Analyze the task and produce an actionable implementation plan. Include the
    plan, task requirements, and relevant evidence in your handoff for the builder.
  transitions:
  - outcome: completed
    to: build
  - outcome: blocked
    to: help
  type: agent
- id: build
  name: Implement and verify
  agentId: factory-builder
  prompt: |
    Implement and verify the task using the plan and any review feedback in the
    handoff. Report the changes and verification, or describe the blocker and
    what has been tried.
  transitions:
  - outcome: completed
    to: review
  - outcome: blocked
    to: help
  type: agent
- id: review
  name: Independent review
  agentId: factory-reviewer
  includeTask: true
  prompt: |
    Independently review the changes against the task and prior handoff. Approve
    only when appropriate; otherwise provide actionable findings for the builder
    or planner, or explain the blocker. Inspect the diff without writing project
    files; do not attempt to verify TDD chronology.
  transitions:
  - outcome: approved
    to: approval
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: help
  type: agent
- id: approval
  name: Human approval
  transitions:
  - outcome: approved
    to: commit
  - outcome: rejected
    to: null
  - outcome: responded
    to: build
  type: human
- id: commit
  name: Create commit
  agentId: factory-committer
  includeTask: true
  prompt: |
    Commit the approved changes. Report the commit or explain the blocker and
    any side effects.
  transitions:
  - outcome: completed
    to: null
  - outcome: blocked
    to: help
  type: agent
- id: help
  name: Resolve blocker
  transitions:
  - outcome: responded
    to: plan
  - outcome: rejected
    to: null
  type: human
