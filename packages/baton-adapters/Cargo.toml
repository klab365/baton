[package]
name = "baton-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
baton-core = { path = "../baton-core" }
async-trait.workspace = true
tokio.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
schemars = "1"
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
rig = { version = "=0.46.0", default-features = false, features = ["agent", "reqwest", "derive", "rustls"] }
rig-harness = "=0.46.0"
rig-basics = { version = "=0.46.0", default-features = false }
bevy_ecs = "=0.20.0"
bevy_app = "=0.20.0"
bevy_log = "=0.20.0"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
