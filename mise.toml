[tools]
bun = "latest"
pi = "latest"
rust = "stable"

[env]
_.file = ".env"

[hooks]
postinstall = "cd packages/baton-web && bun install --frozen-lockfile"

[tasks.dev]
description = "Run the SvelteKit UI and Rust API in the demo project"
run = "bash -c 'BATON_PROJECT_DIR=examples/demo cargo run -p baton-server --bin baton-server & server=$!; trap \"kill $server 2>/dev/null || true\" EXIT INT TERM; cd packages/baton-web && bun run dev -- --host 127.0.0.1 --port 5174'"

[tasks.dev-pi]
description = "Build Baton and start Pi with the local Baton extension"
run = [
  "cargo build -p baton-cli --bin baton",
  'PATH="$PWD/target/debug:$PATH" pi --no-extensions -e "$PWD/extensions/pi/baton.ts"',
]

[tasks.server]
description = "Run the Rust API server for the demo project"
run = "BATON_PROJECT_DIR=examples/demo cargo run -p baton-server --bin baton-server"

[tasks.format-rust]
description = "Format Rust source code"
run = "cargo fmt --all"

[tasks.check-format-rust]
description = "Check Rust source formatting"
run = "cargo fmt --all -- --check"

[tasks.format-web]
description = "Format web source files"
run = "cd packages/baton-web && bun run format"

[tasks.check-format-web]
description = "Check web source formatting"
run = "cd packages/baton-web && bun run check-format"

[tasks.lint-rust]
description = "Lint Rust workspace"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.lint-web]
description = "Lint web source files"
run = "cd packages/baton-web && bun run lint"

[tasks.generate-types]
description = "Generate TypeScript DTO types from Rust"
run = "cargo run -p baton-server --bin generate-types"

[tasks.check-generated-types]
description = "Check committed TypeScript DTO types match Rust"
run = "cargo run -p baton-server --bin generate-types && git diff --exit-code -- packages/baton-web/lib/generated"

[tasks.check]
description = "Run generated-type, Svelte, and TypeScript checks"
depends = ["check-generated-types"]
run = "cd packages/baton-web && bun run check"

[tasks.test]
description = "Run Rust workspace tests"
run = "cargo test --workspace"

[tasks.test-extensions]
description = "Run extension tests"
run = "bun test extensions/"

[tasks.test-browser]
description = "Run Chromium browser tests"
run = "cd packages/baton-web && bun run test-browser"

[tasks.test-embedded-web]
description = "Build the web UI and test it embedded in the Rust server"
run = [
  "cd packages/baton-web && bun run build",
  'BATON_WEB_DIR="$PWD/packages/baton-web/build" cargo test --locked -p baton-server --lib serves_embedded_web_build -- --ignored',
]

[tasks.build-rust]
description = "Build the Rust workspace"
run = "cargo build --workspace"

[tasks.build-web]
description = "Build the SvelteKit UI"
run = "cd packages/baton-web && bun run build"

[tasks.format]
description = "Format Rust and web source files"
depends = ["format-rust", "format-web"]

[tasks.check-format]
description = "Check Rust and web source formatting"
depends = ["check-format-rust", "check-format-web"]

[tasks.lint]
description = "Lint Rust and web source files"
depends = ["lint-rust", "lint-web"]

[tasks.build]
description = "Build the Rust backend and SvelteKit UI"
depends = ["build-rust", "build-web"]
