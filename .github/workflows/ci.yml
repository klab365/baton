name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Mise and Rust
        uses: jdx/mise-action@v2

      - name: Check formatting
        run: mise run check-format-rust

      - name: Run Clippy
        run: mise run lint-rust

      - name: Run tests
        run: mise run test

      - name: Build workspace
        run: mise run build-rust

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Mise, Bun and Pi
        uses: jdx/mise-action@v2

      - name: Check formatting
        run: mise run check-format-web

      - name: Run lint
        run: mise run lint-web

      - name: Check Svelte and TypeScript
        run: mise run check

      - name: Run extension tests
        run: mise run test-extensions

      - name: Install browser
        run: cd packages/baton-web && bunx playwright install --with-deps chromium

      - name: Run browser tests
        run: mise run test-browser

      - name: Build UI
        run: mise run build-web

  ollama-smoke:
    name: Ollama Cloud smoke test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Mise, Rust, Bun and Pi
        uses: jdx/mise-action@v2

      - name: Build Baton CLI
        timeout-minutes: 10
        run: cargo build -p baton-cli --bin baton

      - name: Run Ollama Cloud integration test
        env:
          OLLAMA_LIVE_TEST: "1"
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: "glm-5.3-flash:cloud"
        run: bun test extensions/pi/baton-demo.integration.test.ts

  embedded-web:
    name: Embedded web UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Mise, Rust and Bun
        uses: jdx/mise-action@v2

      - name: Test embedded web UI
        run: mise run test-embedded-web

  require-rebase:
    name: Require rebase
    if: always()
    needs:
      - rust
      - web
      - embedded-web
    runs-on: ubuntu-latest
    steps:
      - name: Require Rust, web and embedded UI checks
        run: |
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.embedded-web.result }}" = "success"

      - name: Check that the pull request includes its base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require rebase onto the current base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git merge-base --is-ancestor "origin/${{ github.event.pull_request.base.ref }}" HEAD
