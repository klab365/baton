---
id: software-factory
steps:
- id: plan
  name: Analyze and plan
  agentId: factory-planner
  prompt: |
    Analyze the task and produce an actionable implementation plan. Include the
    plan and relevant evidence in your handoff for the builder. Report blocked
    if critical information is missing. Do not modify files or commit.
  transitions:
  - outcome: completed
    to: build
  - outcome: blocked
    to: help
  type: agent

- id: build
  name: Implement and verify
  agentId: factory-builder
  prompt: |
    Implement and verify the task using the plan and any review feedback or
    debugger diagnosis in the handoff. Report the changes and verification, or
    describe the blocker and what has been tried. Run applicable checks and verify
    the target branch is an ancestor of HEAD. Do not commit, push or create a PR.
    For each behavior change, add or update a focused test before changing the
    implementation. Run it and confirm it fails for the expected reason, then
    implement the smallest change and rerun it until it passes. In the handoff,
    report the test commands, red and green results, and any exceptions. If
    test-first is impractical, explain why and report the alternative verification;
    never claim a red result that was not observed.
  transitions:
  - outcome: completed
    to: review
  - outcome: blocked
    to: debug
  type: agent
- id: debug
  name: Diagnose builder blocker
  agentId: factory-debugger
  prompt: |
    Independently investigate the blocker in the handoff and inspect the
    repository. Return evidence and actionable next steps for implementation or
    planning; explain when a human or external prerequisite is needed. Use
    revise_build or revise_plan for actionable next steps; use blocked for human
    intervention or after three unresolved attempts. Do not modify files or commit.
  transitions:
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: help
  type: agent

- id: review
  name: Independent review
  agentId: factory-reviewer
  prompt: |
    Independently review the changes against the task and prior handoff. Approve
    only when appropriate; otherwise provide actionable findings for the builder
    or planner, or explain the blocker. Inspect the actual diff and tests, run a
    relevant regression test and verify the target branch is an ancestor of HEAD.
    Check the builder's TDD evidence in the handoff and available session history:
    distinguish an observed test failure before implementation from a passing test
    added afterward. Report missing evidence or exceptions; do not claim TDD was
    followed based on a passing test alone. Request clarification or additional
    verification when needed; do not ask the builder to fabricate a past red run.
    Use approved only when checks pass; otherwise use revise_build, revise_plan or
    blocked. Do not modify files or commit.
  transitions:
  - outcome: approved
    to: commit
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: help
  type: agent

- id: commit
  name: Commit and publish pull request
  agentId: factory-committer
  prompt: |
    Commit the reviewed changes and publish or update the pull request. Report
    the commit and pull request, or explain the blocker and any side effects.
    Stage only intended changes; stop if staged changes or scope are unclear. Check
    the staged diff, use a Conventional Commit, and push without force. Include actual
    verification and a closing issue reference when applicable. Tell the next step
    about pending CI checks and requested reviews. Never rewrite history, merge, push
    a protected branch or create duplicate commits on re-entry.
  transitions:
  - outcome: completed
    to: ci
  - outcome: blocked
    to: help
  type: agent

- id: ci
  name: Verify pull request CI
  agentId: factory-ci
  prompt: |
    Verify the pull request's CI results. Report successful checks, actionable
    failures for the builder, or external blockers requiring human assistance.
    Check all applicable required checks and requested reviews against the current PR
    head. Wait up to 30 minutes, checking at least once per minute, for pending or
    missing checks and requested reviews before treating them as external blockers.
    Process actionable review feedback and CI failures with revise_build; use blocked
    for unresolved external blockers. Missing, pending or inconclusive checks and
    outstanding requested reviews are not success. Report results and URLs.
  transitions:
  - outcome: completed
    to: null
  - outcome: revise_build
    to: build
  - outcome: blocked
    to: ci-help
  type: agent

- id: ci-help
  name: Resolve CI blocker
  transitions:
  - outcome: responded
    to: ci
  - outcome: rejected
    to: null
  type: human

- id: help
  name: Resolve blocker
  transitions:
  - outcome: responded
    to: plan
  - outcome: rejected
    to: null
  type: human
