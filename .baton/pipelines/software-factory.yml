---
id: software-factory
steps:
- id: plan
  name: Analyze and plan
  agentId: factory-planner
  includeTask: true
  prompt: |
    Plan the requested task and pass an actionable plan to the builder. For an
    explicit PR/CI reinspection, follow the planner's protocol and preserve the
    verified repository, branch, PR URL and head SHA in your handoff.
  transitions:
  - outcome: completed
    to: build
  - outcome: blocked
    to: plan-help
  type: agent

- id: build
  name: Implement and verify
  agentId: factory-builder
  prompt: |
    Implement the plan and satisfy the task's acceptance criteria. On re-entry,
    address the latest review/debugging or human feedback. Follow the builder's
    verification and PR/CI reinspection protocol; do not publish changes.
  transitions:
  - outcome: completed
    to: review
  - outcome: blocked
    to: debug
  type: agent

- id: debug
  name: Diagnose builder blocker
  agentId: factory-debugger
  prompt: |
    Independently diagnose the builder's blocker and return evidence plus the
    smallest actionable next step. Follow the debugger's outcome guidance; do not
    modify files.
  transitions:
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: build-help
  type: agent

- id: review
  name: Independent review
  agentId: factory-reviewer
  prompt: |
    Independently review the implementation against the task and prior handoff.
    Follow the reviewer's diff, reinspection and verification protocol. Return
    actionable findings and required review metadata; do not modify files.
  transitions:
  - outcome: approved
    to: commit
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: review-help
  type: agent

- id: commit
  name: Commit and publish pull request
  agentId: factory-committer
  prompt: |
    Publish only changes approved by the reviewer. Follow the committer's
    publication and recovery protocol exactly. Return the verified repository,
    branch, PR URL and head SHA in the final handoff.
  transitions:
  - outcome: completed
    to: null
  - outcome: blocked
    to: commit-help
  type: agent

- id: plan-help
  name: Clarify planning blocker
  transitions:
  - outcome: responded
    to: plan
  - outcome: rejected
    to: null
  type: human

- id: build-help
  name: Resolve implementation blocker
  transitions:
  - outcome: responded
    to: build
  - outcome: rejected
    to: null
  type: human

- id: review-help
  name: Resolve review blocker
  transitions:
  - outcome: responded
    to: review
  - outcome: rejected
    to: null
  type: human

- id: commit-help
  name: Resolve commit blocker
  transitions:
  - outcome: responded
    to: commit
  - outcome: rejected
    to: null
  type: human

- id: help
  name: Resolve workflow blocker
  transitions:
  - outcome: responded
    to: plan
  - outcome: rejected
    to: null
  type: human
