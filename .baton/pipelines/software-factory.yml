---
id: software-factory
steps:
- id: plan
  name: Analyze and plan
  agentId: factory-planner
  includeTask: true
  prompt: |
    Own understanding the task and any referenced issue. Return a self-contained
    implementation handoff with verified acceptance criteria, concrete ordered
    changes, relevant files/modules, tests, and constraints. If requirements are
    unavailable or ambiguous, block here for human clarification; do not send an
    incomplete plan to the builder.
  transitions:
  - outcome: completed
    to: build
  - outcome: blocked
    to: plan-help
  type: agent

- id: build
  name: Implement and verify
  agentId: factory-builder
  includeTask: false
  prompt: |
    Implement as much of the complete plan as possible in this invocation;
    batch related code, tests, and documentation. Report completed only when
    all acceptance criteria are verified. Report revise_build only after a
    meaningful batch when another attempt is genuinely needed, with concrete
    progress and the next substantial batch. Do not loop after a no-change pass:
    continue working or report the specific blocker to a human. Do not reopen
    linked issues or publish changes.
  transitions:
  - outcome: completed
    to: verify
  - outcome: revise_build
    to: build
  - outcome: blocked
    to: build-help
  type: agent

- id: verify
  name: Automated verification
  type: shell
  command: mise run check-format && mise run lint && mise run check && mise run test-extensions && mise run test && mise run build
  timeoutSeconds: 7200
  transitions:
  - outcome: completed
    to: review
  - outcome: failed
    to: build

- id: review
  name: Independent review
  agentId: factory-reviewer
  includeTask: true
  prompt: |
    Review the implementation against the task and report actionable findings.
    Do not modify files.
  transitions:
  - outcome: approved
    to: commit
  - outcome: revise_build
    to: build
  - outcome: blocked
    to: review-help
  type: agent

- id: commit
  name: Commit and publish pull request
  agentId: factory-committer
  includeTask: true
  prompt: |
    Publish only reviewer-approved changes; return the verified repository,
    branch, PR URL and head SHA.
  transitions:
  - outcome: completed
    to: null
  - outcome: blocked
    to: commit-help
  type: agent

- id: plan-help
  name: Clarify planning blocker
  transitions:
  - outcome: responded
    to: plan
  - outcome: rejected
    to: null
  type: human

- id: build-help
  name: Resolve implementation blocker
  transitions:
  - outcome: responded
    to: build
  - outcome: rejected
    to: null
  type: human

- id: review-help
  name: Resolve review blocker
  transitions:
  - outcome: responded
    to: review
  - outcome: rejected
    to: null
  type: human

- id: commit-help
  name: Resolve commit blocker
  transitions:
  - outcome: responded
    to: commit
  - outcome: rejected
    to: null
  type: human
