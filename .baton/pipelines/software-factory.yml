---
id: software-factory
steps:
- id: plan
  name: Analyze and plan
  maxAttempts: 2
  agentId: factory-planner
  includeTask: true
  prompt: |
    Produce an actionable plan that preserves the task's acceptance criteria.
  transitions:
  - outcome: completed
    to: build
  - outcome: blocked
    to: plan-help
  type: agent

- id: build
  name: Implement and verify
  maxAttempts: 2
  agentId: factory-builder
  includeTask: true
  prompt: |
    Implement the plan, satisfy acceptance criteria, and address the latest
    feedback. Do not publish changes.
  transitions:
  - outcome: completed
    to: review
  - outcome: blocked
    to: build-help
  type: agent

- id: review
  name: Independent review
  maxAttempts: 2
  agentId: factory-reviewer
  includeTask: true
  prompt: |
    Review the implementation against the task and report actionable findings.
    Do not modify files.
  transitions:
  - outcome: approved
    to: commit
  - outcome: revise_build
    to: build
  - outcome: blocked
    to: review-help
  type: agent

- id: commit
  name: Commit and publish pull request
  maxAttempts: 2
  agentId: factory-committer
  includeTask: true
  prompt: |
    Publish only reviewer-approved changes; return the verified repository,
    branch, PR URL and head SHA.
  transitions:
  - outcome: completed
    to: null
  - outcome: blocked
    to: commit-help
  type: agent

- id: plan-help
  name: Clarify planning blocker
  transitions:
  - outcome: responded
    to: plan
  - outcome: rejected
    to: null
  type: human

- id: build-help
  name: Resolve implementation blocker
  transitions:
  - outcome: responded
    to: build
  - outcome: rejected
    to: null
  type: human

- id: review-help
  name: Resolve review blocker
  transitions:
  - outcome: responded
    to: review
  - outcome: rejected
    to: null
  type: human

- id: commit-help
  name: Resolve commit blocker
  transitions:
  - outcome: responded
    to: commit
  - outcome: rejected
    to: null
  type: human
