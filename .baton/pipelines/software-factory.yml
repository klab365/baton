---
id: software-factory
steps:
- id: plan
  name: Analyze and plan
  agentId: factory-planner
  transitions:
  - outcome: completed
    to: build
  - outcome: blocked
    to: help
  type: agent
- id: build
  name: Implement and verify
  agentId: factory-builder
  transitions:
  - outcome: completed
    to: review
  - outcome: blocked
    to: debug
  type: agent
- id: debug
  name: Diagnose builder blocker
  agentId: factory-debugger
  transitions:
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: help
  type: agent
- id: review
  name: Independent review
  agentId: factory-reviewer
  transitions:
  - outcome: approved
    to: commit
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: help
  type: agent
- id: commit
  name: Commit and publish pull request
  agentId: factory-committer
  transitions:
  - outcome: completed
    to: ci
  - outcome: blocked
    to: help
  type: agent
- id: ci
  name: Verify pull request CI
  agentId: factory-ci
  transitions:
  - outcome: completed
    to: null
  - outcome: revise_build
    to: build
  - outcome: blocked
    to: ci-help
  type: agent
- id: ci-help
  name: Resolve CI blocker
  transitions:
  - outcome: responded
    to: ci
  - outcome: rejected
    to: null
  type: human
- id: help
  name: Resolve blocker
  transitions:
  - outcome: responded
    to: plan
  - outcome: rejected
    to: null
  type: human
