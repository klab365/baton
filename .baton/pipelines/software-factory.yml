---
id: software-factory
steps:
- id: plan
  name: Analyze and plan
  agentId: factory-planner
  includeTask: true
  prompt: |
    Analyze the task and produce an actionable implementation plan. Include the
    plan, task requirements, issue reference when available, and relevant evidence
    in your handoff for the builder. Report blocked if critical information is
    missing. Do not modify files or commit.
  transitions:
  - outcome: completed
    to: build
  - outcome: blocked
    to: help
  type: agent

- id: build
  name: Implement and verify
  agentId: factory-builder
  prompt: |
    Execute the incoming plan, not as completed work but by inspecting and
    modifying the repository and verifying the changes. On re-entry, act on
    review or debugging feedback and continue the work. A missing implementation
    or clean repository alone is not a blocker.

    If the plan is broad, choose a concrete first implementation slice and
    continue iteratively toward the task's acceptance criteria. Use the issue
    reference in the handoff when clarification is needed. Report blocked only
    for a specific obstacle you cannot resolve through available information or
    reasonable investigation, not merely because work spans multiple layers.

    Use test-first for behavior changes. Report test commands and observed red and
    green results; explain exceptions and alternative verification without claiming
    an unobserved red result. Run applicable checks and verify the target branch
    is an ancestor of HEAD. Report changes and verification, or the blocker and
    attempts made. Do not commit, push or create a PR.
  transitions:
  - outcome: completed
    to: review
  - outcome: blocked
    to: debug
  type: agent

- id: debug
  name: Diagnose builder blocker
  agentId: factory-debugger
  includeTask: true
  prompt: |
    Independently investigate the blocker in the handoff and inspect the
    repository. Return evidence and actionable next steps for implementation or
    planning; explain when a human or external prerequisite is needed. Prefer
    revise_build when builder guidance can resolve the issue; use revise_plan
    only when replanning is necessary. Use blocked when assistance is needed, and
    include a specific human_action when a person must intervene. Do not modify
    files or commit.
  transitions:
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: help
  type: agent

- id: review
  name: Independent review
  agentId: factory-reviewer
  includeTask: true
  prompt: |
    Independently review the changes against the task and prior handoff. Approve
    only when appropriate; otherwise provide actionable findings for the builder
    or planner, or explain the blocker. Inspect the actual diff and tests, run a
    relevant regression test and verify the target branch is an ancestor of HEAD.
    Return findings in the handoff; do not write project files. Do not attempt to
    verify TDD chronology.
    Use approved only when checks pass; otherwise use revise_build, revise_plan or
    blocked. Do not modify files or commit.
  transitions:
  - outcome: approved
    to: commit
  - outcome: revise_build
    to: build
  - outcome: revise_plan
    to: plan
  - outcome: blocked
    to: help
  type: agent

- id: commit
  name: Commit and publish pull request
  agentId: factory-committer
  includeTask: true
  prompt: |
    Commit the reviewed changes and publish or update the pull request. Report
    the commit and pull request, or explain the blocker and any side effects.
    Stage only intended changes; stop if staged changes or scope are unclear. Check
    the staged diff, use a Conventional Commit, and push without force. Include actual
    verification and a closing issue reference when applicable. Tell the next step
    about pending CI checks and requested reviews. Never rewrite history, merge, push
    a protected branch or create duplicate commits on re-entry.
  transitions:
  - outcome: completed
    to: ci
  - outcome: blocked
    to: help
  type: agent

- id: ci
  name: Verify pull request CI
  agentId: factory-ci
  includeTask: true
  prompt: |
    Verify the pull request's CI results. Use the shell to inspect the current PR
    head, applicable required checks and requested reviews, then decide immediately
    whether to report revise_build, completed, or continue waiting. Recheck every 15
    seconds for at most 30 minutes total; do not run an opaque sleep/poll command that
    prevents evaluating results between checks. On each iteration, fetch the current
    head and evaluate only results for that head. If the head changes, discard stale
    check conclusions and re-evaluate against the new head without resetting the
    deadline. Report revise_build immediately for an actionable CI failure or
    changes-requested review, even while other checks are pending. Report completed
    immediately only when every applicable required check passes and all requested
    reviews are resolved. Wait only while checks/reviews are pending or missing; at
    the deadline report blocked for unresolved external blockers. API/auth errors or
    inability to determine required checks are not success: report blocked. Include
    the head SHA, check/review status, relevant unresolved details and URLs in every
    handoff.
  transitions:
  - outcome: completed
    to: null
  - outcome: revise_build
    to: build
  - outcome: blocked
    to: ci-help
  type: agent

- id: ci-help
  name: Resolve CI blocker
  transitions:
  - outcome: responded
    to: ci
  - outcome: rejected
    to: null
  type: human

- id: help
  name: Resolve blocker
  transitions:
  - outcome: responded
    to: plan
  - outcome: rejected
    to: null
  type: human
