[workspace]
resolver = "2"
members = [
  "crates/baton-core",
  "crates/baton-server",
  "crates/baton-cli",
  "crates/baton-adapters",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
medi-rs = "3.2"
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
ts-rs = "10"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time"] }
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
