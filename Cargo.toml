[package]
name = "baton-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
include = ["crates/baton-cli/src/**", "web/**", "static/**", "package.json", "bun.lock", "svelte.config.js", "vite.config.ts", "tsconfig.json", "biome.json"]

[lib]
path = "crates/baton-cli/src/lib.rs"

[[bin]]
name = "baton"
path = "crates/baton-cli/src/main.rs"

[dependencies]
anyhow.workspace = true
baton-core = { path = "crates/baton-core" }
baton-adapters = { path = "crates/baton-adapters" }
serde_json.workspace = true
serde.workspace = true
medi-rs.workspace = true
uuid.workspace = true
baton-server = { path = "crates/baton-server" }
tokio.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
resolver = "2"
members = [
  "crates/baton-core",
  "crates/baton-server",
  "crates/baton-adapters",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.5.0"

[workspace.dependencies]
medi-rs = "3.2"
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
ts-rs = { version = "10", features = ["no-serde-warnings"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time"] }
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
